name = "gimba-agent"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# prompts/*.md and knowledge/*.md are bundled as plain text
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

# LINE conversation memory (one key per LINE user) and the weekly counters
[[kv_namespaces]]
binding = "KV"
id = "9689a523678448edb915fc77f0f92dad" # gimba-agent-kv, created by the first deploy (2026-11-23)

# Monday 01:00 UTC = 09:00 Taiwan: push last week's numbers to the owner's LINE
[triggers]
crons = ["0 1 * * MON"]

[vars]
MODEL = "claude-haiku-5-5"
# LINE alert the first time a day's model cost passes this (USD); about 140 six-turn conversations
DAILY_COST_ALERT_USD = "0.5"

# Secrets (set with `npx wrangler secret put <NAME>`, locally in .dev.vars):
#   ANTHROPIC_API_KEY          Anthropic API key
#   LOG_URL                    Apps Script web app URL that writes to the Google Sheet
#   LOG_SECRET                 shared secret checked by the Apps Script
#   STATE_SECRET               signs the web chat's conversation memory
#   LINE_CHANNEL_SECRET        LINE Messaging API channel secret (Basic settings)
#   LINE_CHANNEL_ACCESS_TOKEN  long-lived channel access token (Messaging API tab)
#   LINE_OWNER_ID              owner's LINE user id ("Your user ID" in Basic settings)
