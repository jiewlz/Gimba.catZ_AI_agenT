name = "gimba-agent"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# prompts/*.md and knowledge/*.md are bundled as plain text
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

[vars]
MODEL = "claude-haiku-5-5"

# Secrets (set with `npx wrangler secret put <NAME>`, locally in .dev.vars):
#   ANTHROPIC_API_KEY  Anthropic API key
#   LOG_URL            Apps Script web app URL that writes to the Google Sheet
#   LOG_SECRET         shared secret checked by the Apps Script
